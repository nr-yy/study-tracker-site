<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed · Study Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
  :root {
    --bg: #FCFAF9;
    --surface: #FFFFFF;
    --ink: #2D2D2D;
    --muted: #5A5A5A;
    --sage: #AFC9BF;
    --peach: #F7D0AB;
    --green: #7E9595;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --surface: #1E1E1E; --ink: #E6E6E6; --muted: #AAAAAA;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    background-image:
      radial-gradient(60% 50% at 95% 2%, rgba(247, 208, 171, .40), rgba(247, 208, 171, 0)),
      radial-gradient(55% 45% at 2% 62%, rgba(215, 164, 154, .26), rgba(215, 164, 154, 0)),
      radial-gradient(60% 50% at 72% 102%, rgba(175, 201, 191, .34), rgba(175, 201, 191, 0));
    font-family: "Nunito Sans", system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: 22px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .07);
  }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--sage);
    display: grid; place-items: center;
  }
  .mark svg { width: 34px; height: 34px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 10px; letter-spacing: -.4px; }
  p { font-size: 15.5px; line-height: 1.5; color: var(--muted); margin: 0 0 8px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 22px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2D1A00" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5 5L20 6.5"/>
      </svg>
    </div>
    <h1>Email confirmed</h1>
    <p>Your Study Tracker account is ready.</p>
    <p>Go back to the app and sign in with your email and password.</p>
    <p class="hint">You can close this page.</p>
  </main>
</body>
</html>
